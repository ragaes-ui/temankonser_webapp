<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="/temankonserlogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokumentasi Teman Konser</title>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
  
<!-- ================= SPASH SCREEN LOADING (TK MUTER) ================= -->
  <div id="global-loader" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-[#030712] transition-opacity duration-700 ease-out">
    
    <div class="relative flex items-center justify-center mb-6">
      <!-- Animasi Cincin Muter (Neon Glow) -->
      <div class="w-20 h-20 border-4 border-slate-800 border-t-indigo-500 border-b-purple-500 rounded-full animate-spin shadow-[0_0_20px_rgba(99,102,241,0.3)]"></div>
      
      <!-- Tulisan TK di Tengah -->
      <div class="absolute text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-br from-indigo-400 to-purple-500 tracking-widest drop-shadow-md">
        TK
      </div>
    </div>
    
    <!-- Teks Loading -->
    <h2 class="text-xs font-bold tracking-[0.5em] text-slate-400 animate-pulse uppercase">
      Memuat
    </h2>
  </div>
  <!-- ================= AKHIR SPLASH SCREEN ================= -->

<!-- Kontainer Utama tempat Mithril merender UI -->
  <div id="app"></div>

  <!-- Vite akan membaca file ini dan memproses CSS serta JS secara otomatis -->
  <script type="module" src="/src/main.js"></script>
