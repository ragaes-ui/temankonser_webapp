<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="/temankonserlogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokumentasi Teman Konser</title>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
  
  <!-- ================= SPASH SCREEN LOADING (EQUALIZER MUSIK) ================= -->
  <div id="global-loader" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-[#030712] transition-opacity duration-700 ease-out">
    
    <!-- CSS Animasi Keren -->
    <style>
      .music-wave {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        height: 60px;
        margin-bottom: 28px;
      }
      .music-wave span {
        width: 10px;
        height: 15px;
        background: #6366f1; /* Warna Indigo */
        border-radius: 6px;
        animation: wave 1s ease-in-out infinite;
      }
      .music-wave span:nth-child(1) { animation-delay: 0.0s; }
      .music-wave span:nth-child(2) { animation-delay: 0.2s; }
      .music-wave span:nth-child(3) { animation-delay: 0.4s; }
      .music-wave span:nth-child(4) { animation-delay: 0.2s; }
      .music-wave span:nth-child(5) { animation-delay: 0.0s; }

      @keyframes wave {
        0%, 100% { height: 15px; background: #6366f1; box-shadow: 0 0 10px rgba(99,102,241,0.4); }
        50% { height: 60px; background: #a855f7; box-shadow: 0 0 25px rgba(168,85,247,0.8); }
      }
    </style>

    <!-- Bar Grafik Suara -->
    <div class="music-wave">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    
    <!-- Teks Animasi -->
    <h2 class="text-lg md:text-xl font-bold tracking-[0.4em] text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-500 animate-pulse uppercase drop-shadow-md">
      MEMUAT MEMORI
    </h2>
  </div>
  <!-- ================= AKHIR SPLASH SCREEN ================= -->

  <!-- Kontainer Utama tempat Mithril merender UI -->
  <div id="app"></div>

  <!-- Vite akan membaca file ini dan memproses CSS serta JS secara otomatis -->
  <script type="module" src="/src/main.js"></script>

</body>
</html>
